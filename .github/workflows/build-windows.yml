name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and packager
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.15.0
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: pyinstaller SamirSoft.spec --clean --noconfirm
      - name: Create checksum
        shell: pwsh
        run: (Get-FileHash 'dist/CBDs.exe' -Algorithm SHA256).Hash + '  CBDs.exe' | Out-File -Encoding ascii 'dist/CBDs.exe.sha256'
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBDs-Windows
          path: |
            dist/CBDs.exe
            dist/CBDs.exe.sha256
          if-no-files-found: error
      - name: Publish latest Windows download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CBDs Latest Windows Build
          body: Download the newest verified CBDs Windows executable below.
          make_latest: true
          overwrite_files: true
          files: |
            dist/CBDs.exe
            dist/CBDs.exe.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CBDs.exe
            dist/CBDs.exe.sha256
          generate_release_notes: true
